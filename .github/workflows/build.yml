name: Build unsigned ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate sound and icon assets
        run: python3 scripts/make_assets.py

      - name: Build app (unsigned, device)
        run: |
          xcodebuild \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            -derivedDataPath build

      - name: Package ipa
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AlarmClock.app"
          test -d "$APP_PATH"
          rm -rf Payload AlarmClock.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AlarmClock.ipa Payload
          ls -lh AlarmClock.ipa

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-ipa
          path: AlarmClock.ipa
          if-no-files-found: error
