name: Build unsigned ipa

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          LATEST_XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Generate sound and icon assets
        run: python3 scripts/make_assets.py

      - name: Build app (unsigned, device)
        run: |
          set +e
          xcodebuild \
            -project AlarmClock.xcodeproj \
            -scheme AlarmClock \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build > build_raw.log 2>&1
          STATUS=$?
          grep -E "error: " build_raw.log | sort -u | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "===== tail of build log ====="
          tail -60 build_raw.log
          exit $STATUS

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_raw.log
          if-no-files-found: ignore

      - name: Package ipa
        if: success()
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/AlarmClock.app"
          test -d "$APP_PATH"
          rm -rf Payload AlarmClock.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry AlarmClock.ipa Payload
          ls -lh AlarmClock.ipa

      - name: Upload ipa artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AlarmClock-ipa
          path: AlarmClock.ipa
          if-no-files-found: error

      - name: Publish ipa to release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-build-${{ github.run_number }}
          name: AlarmClock ipa build ${{ github.run_number }}
          body: Unsigned ipa built from ${{ github.sha }}. Download AlarmClock.ipa below and sideload it.
          files: AlarmClock.ipa
          fail_on_unmatched_files: true
